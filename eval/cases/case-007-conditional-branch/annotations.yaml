strat_id: RHAISTRAT-9007
tier: synthetic
notes: |
  The managed-vs-external fork (HLR-1) genuinely changes the structure of all
  downstream work. Expect an Investigation epic for the posture decision that
  gates everything shaped by it, and — if the decomposer judges the paths
  structurally divergent — conditional branch epics named
  RHAISTRAT-9007-BRANCH-A-E00N.md / BRANCH-B-E00N.md per outcome. A single
  linear DAG that silently assumes one posture (e.g. designs the Milvus
  operator path without the investigation gating it) is a scope-fidelity
  failure: the strategy explicitly has not decided. gated_by must carry
  complete gate_failure_impact.

# Canonical Jira component vocabulary shipped to this case as
