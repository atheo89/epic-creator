sme_substantive: true
notes: "REAL strategy snapshot (tier: real) — verbatim body from a shipped RHAISTRAT,\nanonymized only\
  \ by re-keying and link redaction. There is therefore NO curated\nground-truth decomposition for this\
  \ case: the items below are things to CHECK\nin a candidate decomposition, not a single expected answer.\n\
  \nShape: ~24k characters of description; 11 High Level Requirements (5 P0, 4 P1,\n2 P2); effort estimate\
  \ stated as S (Small, 1-3 sprints); one primary\nimplementing component (the Dashboard frontend) plus\
  \ non-code contributors\n(UXD, Content/microcopy, Docs). The body carries an unusually detailed\nStaff-Engineer/SME\
  \ section with architecture constraints, an explicit\nImpacted-Teams table, Non-Functional Requirements,\
  \ 11 Acceptance Criteria,\nRisks, Assumptions, two Open Questions, and a long Out-of-Scope list. This\
  \ is\na well-refined, tightly scoped strategy — the interesting failure modes are\nover-decomposition\
  \ and scope leakage, not under-specification.\n\nThings a grader should watch for:\n\n- Team/component\
  \ split. Only one engineering component implements code here.\n  A decomposition that invents backend,\
  \ operator, or controller epics is\n  hallucinating scope; the SME section explicitly states that the\
  \ mutating\n  webhook that applies the queue label is out of scope and asks for the\n  operator to be\
  \ removed from the affected-components table. The operator\n  architecture doc is deliberately provisioned\
  \ in .context as a distractor —\n  check the decomposition does not pull it in.\n\n- Work-product splits.\
  \ Non-code work is genuinely present: visual/design\n  treatment and a status-message microcopy table\
  \ are UXD/Content deliverables\n  tracked under a separate UX ticket, and documentation is required\
  \ (at\n  minimum a release note, with a decision to make about feature-level docs).\n  Check whether\
  \ design/content and docs surface as their own nodes rather\n  than being buried inside frontend code\
  \ epics, and that docs is not silently\n  dropped.\n\n- Dependency modelling. The strategy states exactly\
  \ one real dependency (UX\n  finalized designs) and then explicitly says development must NOT be blocked\n\
  \  on it — placeholder copy first, replace later. A DAG that serializes every\n  UI epic behind a design\
  \ epic is over-constraining and contradicts the\n  source; parallel code-with-placeholders alongside\
  \ design/content is truer.\n  Also check that the \"confirmed\" assumption about upstream API availability\n\
  \  in the shipped build is treated as an assumption, not converted into a\n  blocking external dependency.\n\
  \n- Investigations. One open question asks whether ordinary users receive the\n  role bindings that\
  \ would grant access to the queue-position data; the\n  answer changes how much polish one P1 requirement\
  \ deserves, but the code\n  must degrade gracefully either way. Check for a small spike/investigation\n\
  \  node (or an explicit acceptance of graceful degradation) rather than either\n  ignoring the question\
  \ or blocking the whole feature on it. The second open\n  question is a pure UX-form decision and should\
  \ not become an engineering\n  investigation.\n\n- Grouping and epic count. Several HLRs touch the same\
  \ code area (the status\n  derivation model: eviction-reason disambiguation, requeue state, condition\n\
  \  type-union gaps, message overrides with raw-message fallback, progress-step\n  restructuring). A\
  \ plausible decomposition is a handful of coherent epics\n  (status model correctness; queue-position\
  \ API integration with graceful\n  degradation; namespace/workload Kueue indicators; hardware-profile\
  \ form\n  validation and details popover; design/content; docs) — roughly matching an\n  S estimate.\
  \ One-epic-per-HLR inflation, or a single mega-epic swallowing\n  everything, are both suspect. Judge\
  \ on coherence and dependency correctness\n  rather than an exact count.\n\n- Scope discipline. The\
  \ Out-of-Scope list is long and specific (an adjacent\n  strategy covers the sibling surface; several\
  \ capabilities are excluded for\n  stated technical or product reasons, including one that is impossible\
  \ given\n  where quota actually lives, and one that upstream simply does not provide).\n  Check that\
  \ no epic re-introduces an excluded item, and that the adjacent\n  strategy is referenced as a boundary\
  \ rather than absorbed as work.\n\n- Triage. This is real, non-trivial feature work: it is neither\n\
  \  below-threshold nor docs-only, so any triage-style \"no decomposition\n  needed\" verdict is a failure.\n"

