strat_id: RHAISTRAT-9019
tier: synthetic
notes: |
  Work-product splitting probe across all three kinds: product code (gallery
  UI, packaging format), authored content (the six tutorials), and docs
  (usage + contribution). Expect the tutorial authoring (HLR-2) as
  content-authoring epic(s) separate from the gallery/packaging code epics,
  and the docs epic separate again — no epic mixing code with tutorial
  authoring. Reasonable orderings: packaging format (HLR-3) before or beside
  tutorial authoring; gallery UI parallel to content; docs last. A single
  "build gallery and write tutorials" epic is the probed failure.

# Canonical Jira component vocabulary shipped to this case as
# .context/rhai-components.txt. Mirrored here because check judges only
# receive outputs + annotations, and .context is provisioned input rather
# than a collected output. Epic frontmatter 'component' must be one of these
# (decompose-agent.md:61; submit.py validate_component strips anything else).
valid_components:
  - Dashboard
  - Data Science Pipelines
  - Distributed Workloads
  - Documentation
  - Feature Store
  - KServe
  - Llama Stack
  - Model Registry
  - Notebooks
  - Platform Operator
  - Serving Runtimes
  - Training Operator
  - TrustyAI
