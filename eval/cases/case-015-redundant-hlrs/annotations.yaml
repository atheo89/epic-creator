tier: synthetic
notes: |
  Redundancy-detection probe: HLR-1 (side-by-side comparison of selected runs)
  and HLR-3 (a diff view highlighting what changed between two runs) describe
  the same Dashboard surface in different words — the strategy even says
  overlapping wording was kept from the source councils. Expect ONE comparison
  epic whose HLR Traceability lists both HLR-1 and HLR-3. Two sibling epics
  each building a comparison/diff UI is the scope-duplication failure this
  case probes. Registry linkage (HLR-2) is a distinct Model Registry epic.

